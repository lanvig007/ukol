<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moje vizitka</title>
<style>

        body {
            font-family: Arial, sans-serif;

            background-color: #f4f4f9;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            margin: 0;
        }

        .card {
            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);

            text-align: center;

            max-width: 300px;

            width: 100%;
        }

        h1 {
            margin-bottom: 5px;

            color: #333;
        }

        p {
            color: #666;

            margin-bottom: 20px;
        }

        .kontakt {
            text-decoration: none;

            background-color: #007BFF;

            color: white;

            padding: 10px 20px;

            border-radius: 5px;

            display: inline-block;
        }

        .kontakt:hover {
            background-color: #0056b3;
        }
</style>
</head>
<body>
<div class="card">
<h1>Jan Novák</h1>
<p>Webový vývojář</p>
<a href="mailto:jan@example.com" class="kontakt">Napsat e-mail</a>
</div>
</body>
</html>
